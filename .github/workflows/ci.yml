name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4 # bun fmt needs a recent Bun; bump on purpose
            - run: bun install --frozen-lockfile
            - name: Format
              run: bun fmt --check
            - name: Typecheck
              run: bunx tsc --noEmit -p .
            - name: Core has no DOM
              run: bunx tsc --noEmit -p packages/core
            - name: Test
              run: bun test
            - name: Build
              run: bun run build
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: tui runs on Node
              run: node --input-type=module -e "import { createFrame, rowString, setChar } from '@glyph-engine/tui'; const f = createFrame(3, 1); ['中', 'a'].forEach((c, i) => setChar(f, i, c)); if (rowString(f, 0, {}) !== '\x1b[39m\x1b[49m中a\x1b[0m') process.exit(1)"
              working-directory: packages/tui
            - name: Published types work under nodenext and bundler
              run: bun script/check-types.ts
